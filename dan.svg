```xml
<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="1180" height="530" viewBox="0 0 1180 530" font-size="15px">
<style>
@font-face {
  src: local('Consolas'), local('Consolas Bold');
  font-family: 'ConsolasFallback';
  font-display: swap;
  -webkit-size-adjust: 109%;
  size-adjust: 109%;
}
.key      { fill: #5EEAD4; }   
.value    { fill: #E5E7EB; }   
.cc       { fill: #5f6b7a; }   
text, tspan { white-space: pre; }

/* Animações Matrix e Glitch */
@keyframes matrixRain {
  0% { opacity: 0.1; transform: translateY(-10px); }
  50% { opacity: 0.35; }
  100% { opacity: 0.1; transform: translateY(10px); }
}
.matrix-bg {
  animation: matrixRain 3s ease-in-out infinite;
}

/* Animação de troca de caracteres dinâmica no estilo Matrix */
@keyframes charCycle {
  0%   { opacity: 0.9; fill: #39ff14; }
  20%  { opacity: 0.6; fill: #00f0ff; }
  40%  { opacity: 1;   fill: #ffffff; text-shadow: 0 0 8px #39ff14; }
  60%  { opacity: 0.4; fill: #008f11; }
  80%  { opacity: 0.8; fill: #39ff14; }
  100% { opacity: 0.9; fill: #39ff14; }
}

.matrix-art {
  animation: charCycle 2s steps(4) infinite;
}
</style>

<defs>
    <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.5" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00f0ff" />
        <stop offset="100%" stop-color="#39ff14" />
    </linearGradient>
</defs>

<!-- Fundo com tema Cyber/Matrix -->
<rect width="1180" height="530" fill="#050805" rx="15" stroke="rgba(57, 255, 20, 0.3)" stroke-width="2"/>

<!-- Linhas de código de fundo -->
<g class="matrix-bg" fill="#39ff14" opacity="0.15" font-size="12px">
    <text x="40" y="40">01000100 01100001</text>
    <text x="320" y="120">SYSTEM_DECRYPTING...</text>
    <text x="120" y="380">&lt;/DANIEL_LUCENA&gt;</text>
    <text x="380" y="480">11010011 010101</text>
</g>

